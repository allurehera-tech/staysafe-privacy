name: Build Stay Safe APK and Play bundle

on:
  push:
    branches: [main]
    paths:
      - ".build-input/StaySafe-Android.zip.b64"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Decode Android project
        run: |
          mkdir android-project
          base64 --decode .build-input/StaySafe-Android.zip.b64 > "$RUNNER_TEMP/staysafe.zip"
          unzip -q "$RUNNER_TEMP/staysafe.zip" -d android-project

      - name: Apply Android 16 and volume-key compatibility updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project")
          service = root / "app/src/main/java/ro/staysafe/app/StaySafeAccessibilityService.kt"
          s = service.read_text()
          old_import = "import android.accessibilityservice.AccessibilityService\n"
          if "import android.accessibilityservice.AccessibilityServiceInfo" not in s:
              assert old_import in s, "Could not find AccessibilityService import"
              s = s.replace(old_import, old_import + "import android.accessibilityservice.AccessibilityServiceInfo\n", 1)
          old = """    override fun onServiceConnected() {
                  super.onServiceConnected()
                  activeInstance = this
              }"""
          new = """    override fun onServiceConnected() {
                  super.onServiceConnected()
                  // Explicitly request hardware-key filtering at runtime as well as in XML metadata.
                  serviceInfo = serviceInfo.apply {
                      flags = flags or AccessibilityServiceInfo.FLAG_REQUEST_FILTER_KEY_EVENTS
                  }
                  activeInstance = this
              }"""
          assert old in s, "Could not find onServiceConnected implementation"
          service.write_text(s.replace(old, new, 1))

          import re
          alarm = root / "app/src/main/java/ro/staysafe/app/AlarmService.kt"
          s = alarm.read_text()
          new_trigger = """        fun triggerEmergency(context: android.content.Context) {
                  val appContext = context.applicationContext
                  val intent = Intent(appContext, AlarmService::class.java).setAction(ACTION_EMERGENCY)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) appContext.startForegroundService(intent)
                      else appContext.startService(intent)
                  } catch (e: RuntimeException) {
                      android.util.Log.e("StaySafe", "Could not start emergency foreground service", e)
                      appContext.getSharedPreferences(MainActivity.PREFS, android.content.Context.MODE_PRIVATE)
                          .edit().putBoolean("emergency_start_failed", true).apply()
                  }
              }"""
          s, count = re.subn(r"fun triggerEmergency\(context: android\.content\.Context\) \{[\s\S]*?(?=\n\s*fun disarmFromApp)", new_trigger, s, count=1, flags=re.S | re.M)
          assert count == 1, "Could not patch triggerEmergency implementation"

          new_ringtone = """    private fun startRingtone() {
                  if (ringtone?.isPlaying == true) return
                  val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  try {
                      ringtone = alarmUri?.let { RingtoneManager.getRingtone(applicationContext, it) }?.apply {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              isLooping = true
                              audioAttributes = AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          }
                          play()
                      }
                  } catch (e: RuntimeException) {
                      android.util.Log.e("StaySafe", "Could not play alarm ringtone", e)
                      ringtone = null
                  }
              }

          """
          start = s.index("    private fun startRingtone() {")
          end = s.index("    private fun dispatchEmergencySms()", start)
          s = s[:start] + new_ringtone + s[end:]
          alarm.write_text(s)

          # Add first-launch runtime permission onboarding after explicit disclosure consent.
          main = root / "app/src/main/java/ro/staysafe/app/MainActivity.kt"
          s = main.read_text()
          if "private var firstLaunchPermissionFlow = false" not in s:
              anchor = "    private var waitingForRuntimePermissions = false\n"
              assert anchor in s, "Could not find MainActivity state declarations"
              s = s.replace(anchor, anchor + "    private var firstLaunchPermissionFlow = false\n", 1)
          if "maybeStartFirstLaunchFlow()" not in s:
              anchor = "        showHome()\n"
              assert anchor in s, "Could not find MainActivity onCreate"
              s = s.replace(anchor, anchor + "        maybeStartFirstLaunchFlow()\n", 1)
          if "if (firstLaunchPermissionFlow)" not in s:
              anchor = "            waitingForRuntimePermissions = false\n"
              assert anchor in s, "Could not find runtime permission callback"
              callback = """            if (firstLaunchPermissionFlow) {
                          firstLaunchPermissionFlow = false
                          val smsGranted = checkSelfPermission(Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED
                          val locationGranted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                              checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          if (!smsGranted || !locationGranted) toast(strings.get("permissionsMissing"))
                          return
                      }
          """
              s = s.replace(anchor, anchor + callback, 1)
          if "private fun maybeStartFirstLaunchFlow()" not in s:
              anchor = "    private fun showHome() {\n"
              assert anchor in s, "Could not find showHome insertion point"
              methods = """    /** Request runtime permissions only after explicit consent. This does not arm SOS;
              * contacts and special Android settings must still be configured by the user.
              */
              private fun maybeStartFirstLaunchFlow() {
              val prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
              if (prefs.getBoolean(KEY_FIRST_LAUNCH_FLOW_SHOWN, false)) return
              AlertDialog.Builder(this)
              .setTitle(strings.get("disclosureTitle"))
              .setMessage(strings.get("disclosure") + "\\n\\n" + strings.get("intro"))
              .setPositiveButton(strings.get("agree")) { _, _ ->
              prefs.edit().putBoolean(KEY_FIRST_LAUNCH_FLOW_SHOWN, true).apply()
              requestFirstLaunchRuntimePermissions()
              }
              .setNegativeButton(strings.get("cancel")) { _, _ ->
              prefs.edit().putBoolean(KEY_FIRST_LAUNCH_FLOW_SHOWN, true).apply()
              }
              .setOnCancelListener {
              prefs.edit().putBoolean(KEY_FIRST_LAUNCH_FLOW_SHOWN, true).apply()
              }
              .show()
              }
              
              private fun requestFirstLaunchRuntimePermissions() {
              val required = mutableListOf(
              Manifest.permission.SEND_SMS,
              Manifest.permission.ACCESS_FINE_LOCATION,
              Manifest.permission.ACCESS_COARSE_LOCATION
              )
              if (Build.VERSION.SDK_INT >= 33) required += Manifest.permission.POST_NOTIFICATIONS
              val missing = required.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
              if (missing.isEmpty()) return
              firstLaunchPermissionFlow = true
              waitingForRuntimePermissions = true
              requestPermissions(missing.toTypedArray(), REQUEST_PERMISSIONS)
              }
              
          """
              s = s.replace(anchor, methods + anchor, 1)
          if "private const val KEY_FIRST_LAUNCH_FLOW_SHOWN" not in s:
              anchor = '        const val PREFS = "stay_safe_settings"\n'
              assert anchor in s, "Could not find preference constants"
              s = s.replace(anchor, anchor + '        private const val KEY_FIRST_LAUNCH_FLOW_SHOWN = "first_launch_permission_flow_shown"\n', 1)
          main.write_text(s)

          # Bump the test build version so Android installs it as an update.
          app_gradle = root / "app/build.gradle.kts"
          s = app_gradle.read_text().replace("versionCode = 1", "versionCode = 3").replace('versionName = "1.2"', 'versionName = "1.4"')
          app_gradle.write_text(s)

          app_gradle = root / "app/build.gradle.kts"
          s = app_gradle.read_text()
          s = s.replace("compileSdk = 35", "compileSdk = 36")
          s = s.replace("targetSdk = 35", "targetSdk = 36")
          s = s.replace("versionCode = 1", "versionCode = 3")
          s = s.replace('versionName = "1.2"', 'versionName = "1.4"')
          assert "targetSdk = 36" in s, "Failed to set target SDK 36"
          app_gradle.write_text(s)

          root_gradle = root / "build.gradle.kts"
          s = root_gradle.read_text()
          s = s.replace('com.android.application") version "8.7.3"', 'com.android.application") version "8.10.1"')
          s = s.replace('org.jetbrains.kotlin.android") version "2.0.21"', 'org.jetbrains.kotlin.android") version "2.1.20"')
          assert 'version "8.10.1"' in s and 'version "2.1.20"' in s, "Failed to update build plugin versions"
          root_gradle.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon -p android-project :app:assembleDebug

      - name: Build release App Bundle candidate
        run: gradle --no-daemon -p android-project :app:bundleRelease

      - name: Upload APK and AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: staysafe-android-16-build
          path: |
            android-project/app/build/outputs/apk/debug/app-debug.apk
            android-project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
