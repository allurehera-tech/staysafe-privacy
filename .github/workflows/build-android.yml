name: Build Stay Safe APK and Play bundle

on:
  push:
    branches: [main]
    paths:
      - ".build-input/StaySafe-Android.zip.b64"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Decode Android project
        run: |
          mkdir android-project
          base64 --decode .build-input/StaySafe-Android.zip.b64 > "$RUNNER_TEMP/staysafe.zip"
          unzip -q "$RUNNER_TEMP/staysafe.zip" -d android-project

      - name: Apply Android 16 and volume-key compatibility updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-project")
          service = root / "app/src/main/java/ro/staysafe/app/StaySafeAccessibilityService.kt"
          s = service.read_text()
          old_import = "import android.accessibilityservice.AccessibilityService\n"
          if "import android.accessibilityservice.AccessibilityServiceInfo" not in s:
              assert old_import in s, "Could not find AccessibilityService import"
              s = s.replace(old_import, old_import + "import android.accessibilityservice.AccessibilityServiceInfo\n", 1)
          old = """    override fun onServiceConnected() {
                  super.onServiceConnected()
                  activeInstance = this
              }"""
          new = """    override fun onServiceConnected() {
                  super.onServiceConnected()
                  // Explicitly request hardware-key filtering at runtime as well as in XML metadata.
                  serviceInfo = serviceInfo.apply {
                      flags = flags or AccessibilityServiceInfo.FLAG_REQUEST_FILTER_KEY_EVENTS
                  }
                  activeInstance = this
              }"""
          assert old in s, "Could not find onServiceConnected implementation"
          service.write_text(s.replace(old, new, 1))

          alarm = root / "app/src/main/java/ro/staysafe/app/AlarmService.kt"
          s = alarm.read_text()
          old_trigger = '''        fun triggerEmergency(context: android.content.Context) {
                  val instance = runningInstance
                  if (instance != null) {
                      instance.triggerEmergency()
                      return
                  }
                  val intent = Intent(context, AlarmService::class.java).setAction(ACTION_EMERGENCY)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent)
                      else context.startService(intent)
                  } catch (_: RuntimeException) {
                      // The app's setup screen can be reopened to re-arm the foreground service.
                  }
              }'''
          new_trigger = '''        fun triggerEmergency(context: android.content.Context) {
                  val appContext = context.applicationContext
                  val intent = Intent(appContext, AlarmService::class.java).setAction(ACTION_EMERGENCY)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) appContext.startForegroundService(intent)
                      else appContext.startService(intent)
                  } catch (e: RuntimeException) {
                      android.util.Log.e("StaySafe", "Could not start emergency foreground service", e)
                      appContext.getSharedPreferences(MainActivity.PREFS, android.content.Context.MODE_PRIVATE)
                          .edit().putBoolean("emergency_start_failed", true).apply()
                  }
              }'''
          assert old_trigger in s, "Could not find triggerEmergency implementation"
          s = s.replace(old_trigger, new_trigger, 1)
          s = s.replace('''        val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                  ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
              ringtone = RingtoneManager.getRingtone(applicationContext, alarmUri)?.apply {''', '''        val alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                  ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                  ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
              try {
                  ringtone = alarmUri?.let { RingtoneManager.getRingtone(applicationContext, it) }?.apply {''', 1)
          s = s.replace('''                  play()
              }
          }

          private fun dispatchEmergencySms()''', '''                  play()
                  }
              } catch (e: RuntimeException) {
                  android.util.Log.e("StaySafe", "Could not play alarm ringtone", e)
                  ringtone = null
              }
          }

          private fun dispatchEmergencySms()''', 1)
          alarm.write_text(s)

          # Bump the test build version so Android installs it as an update.
          app_gradle = root / "app/build.gradle.kts"
          s = app_gradle.read_text().replace("versionCode = 1", "versionCode = 3").replace('versionName = "1.2"', 'versionName = "1.4"')
          app_gradle.write_text(s)

          app_gradle = root / "app/build.gradle.kts"
          s = app_gradle.read_text()
          s = s.replace("compileSdk = 35", "compileSdk = 36")
          s = s.replace("targetSdk = 35", "targetSdk = 36")
          s = s.replace("versionCode = 1", "versionCode = 2")
          s = s.replace('versionName = "1.2"', 'versionName = "1.3"')
          assert "targetSdk = 36" in s, "Failed to set target SDK 36"
          app_gradle.write_text(s)

          root_gradle = root / "build.gradle.kts"
          s = root_gradle.read_text()
          s = s.replace('com.android.application") version "8.7.3"', 'com.android.application") version "8.10.1"')
          s = s.replace('org.jetbrains.kotlin.android") version "2.0.21"', 'org.jetbrains.kotlin.android") version "2.1.20"')
          assert 'version "8.10.1"' in s and 'version "2.1.20"' in s, "Failed to update build plugin versions"
          root_gradle.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon -p android-project :app:assembleDebug

      - name: Build release App Bundle candidate
        run: gradle --no-daemon -p android-project :app:bundleRelease

      - name: Upload APK and AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: staysafe-android-16-build
          path: |
            android-project/app/build/outputs/apk/debug/app-debug.apk
            android-project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
